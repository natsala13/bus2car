[project]
name = "bus-car-index"
version = "0.1.0"
description = "Reproducible public-transport versus driving travel-time measurements"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
]

[project.scripts]
resolve-address = "routes_api.adresses:cli"
route-time = "routes_api.routes:cli"
measure-benchmark = "routes_api.benchmark:cli"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-socket>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routes_api"]

[tool.pytest.ini_options]
addopts = "--disable-socket"
testpaths = ["tests"]
